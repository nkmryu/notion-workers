name: Maintain Notion diary pages

on:
  schedule:
    # cron は UTC 指定。JST では 2:23 に実行し、7:23 は失敗時の再試行として同じ処理を走らせる。
    # 毎時 0 分は schedule が混み、遅延や取りこぼしが増えると GitHub の文書にあるため、0 分を避ける。
    - cron: "23 17 * * *"
    - cron: "23 22 * * *"

  workflow_dispatch:

# 同時に走ると同じ日の Daily・習慣ページを二重作成し、同じまとめを二重に書き得るため、実行を直列化する。
concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run maintain
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_HABIT_DATA_SOURCE_ID: ${{ secrets.NOTION_HABIT_DATA_SOURCE_ID }}
          NOTION_TEMPLATE_ID: 3a1372a1dbcd8014b380e2c11c3601d6
