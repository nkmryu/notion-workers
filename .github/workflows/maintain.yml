name: Maintain Notion diary pages

on:
  # 本番の起動は Cloudflare Workers の Cron（cron/）が送る workflow_dispatch。
  workflow_dispatch:

  # 予備。Cloudflare の Cron と同じ時刻（UTC。JST 2:23 と 7:23）に置く。
  # GitHub の schedule は数時間遅れ、取りこぼしもあるので本番にはしない。
  # 消さないのは、Cloudflare の Cron やトークンが止まっても、遅れてでも Daily を作るため。
  # どちらから起動しても concurrency で直列になり、処理は冪等なので、二重に動いても害はない。
  # 毎時 0 分は schedule が混み、遅延や取りこぼしが増えると GitHub の文書にあるため、0 分を避ける。
  schedule:
    - cron: "23 17 * * *"
    - cron: "23 22 * * *"

# 同時に走ると同じ日の Daily・習慣ページを二重作成し、同じまとめを二重に書き得るため、実行を直列化する。
concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run maintain
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_HABIT_DATA_SOURCE_ID: ${{ secrets.NOTION_HABIT_DATA_SOURCE_ID }}
          NOTION_TEMPLATE_ID: 3a1372a1dbcd8014b380e2c11c3601d6
