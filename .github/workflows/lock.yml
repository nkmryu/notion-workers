name: Lock old Notion pages

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lock
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          LOCK_AFTER_DAYS: 30
          DRY_RUN: false